openapi: 3.1.0
info:
  title: SYNQORIA M28 Human Resources, Staffing and Payroll API
  version: 1.0.0
  description: 'Generated by tools/gen_m28_openapi.py from services/analytics-core. Engineering contract; NOT clinical, statistical or financial
    validation. SCOPE: cell and facility come only from the verified claims synqoria_cell / synqoria_facility; PostgreSQL forced row-level security
    repeats the check. A hospital cell can never read another cell''s data. Inside one cell, a holder of m28:cell_aggregate_read may read published
    aggregates only (never events or facts), and only when at least 3 facilities contribute; a single facility''s value is never revealed. PROVENANCE:
    metrics come from independently verified sources through idempotent, version-ordered ingestion; invalid events are quarantined with reasons.
    Every value carries the metric version, source watermark and a stale flag. Unknown is never zero: results are OK, INCOMPLETE (unknown inputs
    counted), SUPPRESSED (group smaller than the metric''s minimum cell, with complementary suppression) or NO_DATA, and suppressed or empty rows
    carry no numbers (enforced by a database CHECK). Amounts are exact decimals and are never summed across currencies. REPORTS AND EXPORTS: reports
    are approved definitions that read stored, disclosure-controlled values only; runs are asynchronous and permissioned by the report. Only CSV
    is implemented (PDF and XLSX are refused with unsupported_format, never faked). An export needs independent approval, carries a provenance
    watermark and SHA-256, expires, is purged at expiry, and every download is audited. CSV cells that could be read as spreadsheet formulas are
    neutralised. IDEMPOTENCY: every POST needs Idempotency-Key (replays return the stored response); transitions carry expectedVersion (mismatch
    is 409 stale_version).'
