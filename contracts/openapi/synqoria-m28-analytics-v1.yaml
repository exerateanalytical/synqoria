              $ref: '#/components/schemas/ExportRequest'
  /exports:
    get:
      operationId: exportList
      summary: Export list
      description: Requires `m28:report_read`.
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 25
          minimum: 1
          maximum: 200
      x-permission: m28:report_read
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
  /exports/{id}/decision:
    post:
      operationId: exportDecision
      summary: Export decision
      description: Requires `m28:export_approve`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-permission: m28:export_approve
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/Result'
        '201':
          $ref: '#/components/responses/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportDecision'
  /exports/{id}/download:
    post:
      operationId: exportDownload
      summary: Export download
      description: Requires `m28:export_download`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-permission: m28:export_download
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/Result'
        '201':
          $ref: '#/components/responses/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
  /exports/expire-due:
    post:
      operationId: exportExpire
      summary: Export expire
      description: Requires `m28:export_approve`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-permission: m28:export_approve
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/Result'
        '201':
          $ref: '#/components/responses/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.invalid/.well-known/openid-configuration
      description: Placeholder; issuer configured per hospital cell. Claims synqoria_cell, synqoria_facility, synqoria_permissions, synqoria_grant_expires.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Result:
      description: Resource, page or result object (see operation description)
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Unauthorized:
      description: identity_denied or grant_expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: permission_denied, grant_denied or an independence rule (*_must_be_independent)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Absent or outside the caller's cell/facility
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: stale_version, idempotency_collision, invalid_transition, source_not_verified, metric_not_approved, report_not_approved, export_not_ready,
        export_expired, evidence_mismatch, still_invalid, retry_limit, duplicate_record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Semantic validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      - details
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
    SourceRequest:
      type: object
      additionalProperties: false
      properties:
        sourceKey:
          type: string
        name:
          type: string
        domain:
          type: string
        ownerRef:
          type: string
        contractVersion:
          type: integer
        requiredFields:
          type: array
          items:
            type: string
        maxLatenessMinutes:
          type: integer
        maxStalenessMinutes:
          type: integer
      required:
      - contractVersion
      - maxLatenessMinutes
      - maxStalenessMinutes
    Decision:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        approve:
          type: boolean
        note:
          type: string
      required:
      - expectedVersion
      - approve
    Transition:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
      required:
      - expectedVersion
    EventIn:
      type: object
      additionalProperties: false
      properties:
        sourceEventId:
          type: string
        entityKey:
          type: string
        sourceVersion:
          type: integer
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
      required:
      - sourceVersion
    IngestRequest:
      type: object
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventIn'
    DiscardRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    MetricRequest:
      type: object
      additionalProperties: false
      properties:
        metricKey:
          type: string
        nameEn:
          type: string
        nameFr:
          type: string
        domain:
          type: string
        unit:
          type: string
        definition:
          type: object
          additionalProperties: true
        minCell:
          type: integer
        effectiveFrom:
          type: string
          format: date
      required:
      - minCell
    ComputeRequest:
      type: object
      additionalProperties: false
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
    ReportRequest:
      type: object
      additionalProperties: false
      properties:
        reportKey:
          type: string
        nameEn:
          type: string
        nameFr:
          type: string
        metricKeys:
          type: array
          items:
            type: string
        maxPeriodDays:
          type: integer
        requiredPermission:
          type: string
      required:
      - maxPeriodDays
    RunRequest:
      type: object
      additionalProperties: false
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
    ScheduleRequest:
      type: object
      additionalProperties: false
      properties:
        everyMinutes:
          type: integer
        lookbackDays:
          type: integer
      required:
      - everyMinutes
      - lookbackDays
    ExportRequest:
      type: object
      additionalProperties: false
      properties:
        format:
          type: string
        purpose:
          type: string
    ExportDecision:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        approve:
          type: boolean
        note:
          type: string
      required:
      - expectedVersion
      - approve
x-permissions:
  vocabulary:
  - m28:cell_aggregate_read
  - m28:compute
  - m28:export_approve
  - m28:export_download
  - m28:export_request
  - m28:ingest
  - m28:metric_approve
  - m28:metric_manage
  - m28:quarantine_manage
  - m28:read_clinical
  - m28:read_financial
  - m28:read_operations
  - m28:rebuild
  - m28:report_approve
  - m28:report_manage
  - m28:report_read
  - m28:report_run
  - m28:schedule_manage
  - m28:source_manage
  - m28:source_verify
  checker:
  - m28:export_approve
  - m28:metric_approve
  - m28:report_approve
  - m28:source_verify
