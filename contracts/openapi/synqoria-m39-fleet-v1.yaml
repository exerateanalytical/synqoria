components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.invalid/.well-known/openid-configuration
      description: Placeholder; issuer configured per hospital cell. Claims synqoria_cell, synqoria_facility, synqoria_permissions, synqoria_grant_expires.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Result:
      description: Resource, page or result object (see operation description)
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Unauthorized:
      description: identity_denied or grant_expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: permission_denied, grant_denied or tenant_scope_denied or an independence rule (*_must_be_independent)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Absent or outside the caller's cell/facility
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: stale_version, idempotency_collision, invalid_transition, stale_placement_epoch, not_qualified, incompatible_release, evidence_mismatch,
        verification_failed, irreversible, rollout_stopped, stage_not_open, stage_incomplete, health_gate_failed, qualification_incomplete, migration_in_progress,
        residency_violation, duplicate_record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Semantic validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RoutingFence:
      type: object
      additionalProperties: false
      required: [routeKey, cellId, placementEpoch, directoryVersion, cellState, health, observedAt]
      properties:
        routeKey:
          type: string
        cellId:
          type: string
          format: uuid
        placementEpoch:
          type: integer
          format: int64
          minimum: 0
        directoryVersion:
          type: integer
          format: int64
          minimum: 0
        cellState:
          type: string
          enum: [ACTIVE]
        health:
          type: string
          enum: [HEALTHY, DEGRADED]
        observedAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
      - error
      - details
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
    ProvisionRequest:
      type: object
      additionalProperties: false
      properties:
        requestKey:
          type: string
        tenantKey:
          type: string
        tenantName:
          type: string
        region:
          type: string
        tier:
          type: string
        capacityUnits:
          type: integer
        serviceProfile:
          type: array
          items:
            type: string
        storageIsolation:
          type: string
        residencyPolicy:
          type: string
        rollbackMetadata:
          type: object
          additionalProperties: true
      required:
      - capacityUnits
    Decision:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        approve:
          type: boolean
      required:
      - expectedVersion
      - approve
    ApplyRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        executorResult:
          type: string
        failureCode:
          type: string
      required:
      - expectedVersion
    RollbackRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        reason:
          type: string
      required:
      - expectedVersion
    Transition:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        to:
          type: string
        reason:
          type: string
      required:
      - expectedVersion
    CheckRequest:
      type: object
      additionalProperties: false
      properties:
        checkKey:
          type: string
        result:
          type: string
        evidenceRef:
          type: string
        detail:
          type: string
    Complete:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
      required:
      - expectedVersion
    HealthReport:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        observedAt:
          type: string
          format: date-time
        releaseKey:
          type: string
    RouteRequest:
      type: object
      additionalProperties: false
      properties:
        routeKey:
          type: string
        cellId:
          type: string
          format: uuid
    Switch:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        expectedEpoch:
          type: integer
        toCell:
          type: string
          format: uuid
        reason:
          type: string
      required:
      - expectedVersion
      - expectedEpoch
    ManifestRequest:
      type: object
      additionalProperties: false
      properties:
        releaseKey:
          type: string
        artifactDigest:
          type: string
        minSchema:
          type: integer
        maxSchema:
          type: integer
      required:
      - minSchema
      - maxSchema
    RolloutRequest:
      type: object
      additionalProperties: false
      properties:
        manifestId:
          type: string
          format: uuid
        stages:
          type: array
          items:
            type: array
            items:
              type: string
              format: uuid
    Evidence:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        evidenceRef:
          type: string
        artifactDigest:
          type: string
    Advance:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
      required:
      - expectedVersion
    Stop:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        reason:
          type: string
      required:
      - expectedVersion
    Plan:
      type: object
      additionalProperties: false
      properties:
        sourceCell:
          type: string
          format: uuid
        targetCell:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
    StepRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        step:
          type: string
        evidence:
          type: string
        sourceDigest:
          type: string
        targetDigest:
          type: string
        lagMs:
          type: integer
        expectedEpoch:
          type: integer
      required:
      - expectedVersion
    Rollback:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        reason:
          type: string
        expectedEpoch:
          type: integer
      required:
      - expectedVersion
