openapi: 3.1.0
info:
  title: SYNQORIA M39 Offline Synchronization and Ownership Reconciliation API
  version: 1.0.0
  description: 'Generated by tools/gen_m39_openapi.py from services/cell-lifecycle-core. Engineering contract; NOT operational acceptance. No
    real hospital cell is provisioned, migrated or retired by this service: it records and governs the control-plane state machines and their
    evidence; infrastructure executors are external. AUTHORITY: this is the MANAGEMENT PLANE. synqoria_cell / synqoria_facility identify the management
    plane; hospital cells are rows. It holds no clinical, identity or authorization data. Tenant-scoped operators (claim synqoria_tenant_scope)
    see and change only their own tenants; platform-wide operators have no such claim; PostgreSQL forced row-level security repeats the check.
    LIFECYCLE: PROVISIONING, QUALIFIED, ACTIVE, DRAINING, FENCED, MIGRATING, RETIRED, FAILED with explicit permitted transitions enforced in code
    and by trigger; activation requires a passed eight-check qualification completed by a different person. ROUTING: decisions are HMAC-signed,
    short-lived, carry the placement epoch and directory version, and FAIL CLOSED (only ACTIVE cells with a recent HEALTHY/DEGRADED observation
    are routable). Placement epochs only rise. RELEASES: approved manifests (maker-checker), schema-compatibility gate, canary stages, deployment
    evidence whose digest must equal the manifest, health gate between stages, automatic stop on failure or unhealthy cells. MIGRATION: prepare,
    copy, catch up, freeze, fence, verify, switch, observe, retire; verification must match digests; the switch needs an independent approver
    and the expected epoch; rollback until retirement, irreversible after. IDEMPOTENCY: every POST needs Idempotency-Key (replays return the stored
    response); transitions carry expectedVersion (mismatch is 409 stale_version).'
