openapi: 3.1.0
info:
  title: SYNQORIA M38 Offline Synchronization and Ownership Reconciliation API
  version: 1.0.0
  description: 'Generated by tools/gen_m38_openapi.py from services/offline-sync-core. Engineering contract; NOT clinical approval or security
    certification. SCOPE: cell and facility come only from the verified claims synqoria_cell / synqoria_facility; PostgreSQL forced row-level
    security repeats the check. BOUNDARY: this service owns the sync envelope (devices, queued command evidence, conflicts, ownership epochs,
    reconciliation decisions). It does not own clinical data or identity; authoritative record heads are published by the owning domain and accepted
    commands are dispatched to that domain through the outbox. SYNC: POST /sync/batches is bounded (50 commands), idempotent per batch key and
    per command id, replays with altered content are refused (replay_mismatch), each command gets a per-record outcome (APPLIED, CONFLICT, REJECTED,
    EXPIRED, DUPLICATE, RETRY) and a resumable cursor. A stale or overlapping change is NEVER applied silently: it becomes a conflict for authorized
    review. Operations requiring a clinical safety gate cannot be queued offline. OWNERSHIP: epochs are monotonic and rise by exactly one only
    when an independently approved transfer completes after positive fencing evidence; writers holding an older epoch are fenced into a conflict.
    IDEMPOTENCY: every POST needs Idempotency-Key (replays return the stored response); transitions carry expectedVersion (mismatch is 409 stale_version).'
servers:
- url: /api/v1/offline
security:
- oidc: []
