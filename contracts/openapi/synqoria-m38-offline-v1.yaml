components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.invalid/.well-known/openid-configuration
      description: Placeholder; issuer configured per hospital cell. Claims synqoria_cell, synqoria_facility, synqoria_permissions, synqoria_grant_expires.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Result:
      description: Resource, page or result object (see operation description)
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Unauthorized:
      description: identity_denied or grant_expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: permission_denied, grant_denied or device_revoked, device_session_expired, device_user_mismatch or an independence rule (*_must_be_independent)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Absent or outside the caller's cell/facility
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: stale_version, idempotency_collision, invalid_transition, record_frozen, epoch_changed, head_moved, fence_version_mismatch,
        already_owner, duplicate_record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Semantic validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      - details
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
    ContractRequest:
      type: object
      additionalProperties: false
      properties:
        operationType:
          type: string
        recordType:
          type: string
        ownerDomain:
          type: string
        offlineAllowed:
          type: boolean
        requiresSafetyGate:
          type: boolean
        mergeable:
          type: boolean
        maxQueueAgeMinutes:
          type: integer
      required:
      - offlineAllowed
      - requiresSafetyGate
      - mergeable
      - maxQueueAgeMinutes
    Decision:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        approve:
          type: boolean
      required:
      - expectedVersion
      - approve
    DeviceRequest:
      type: object
      additionalProperties: false
      properties:
        deviceKey:
          type: string
        label:
          type: string
        boundUser:
          type: string
          format: uuid
        sessionMinutes:
          type: integer
        queueLimit:
          type: integer
      required:
