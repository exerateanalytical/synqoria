openapi: 3.1.0
info:
  title: SYNQORIA M40 Offline Synchronization and Ownership Reconciliation API
  version: 1.0.0
  description: 'Generated by tools/gen_m40_openapi.py from services/reliability-core. Engineering contract; NOT operational acceptance, and no
    recovery guarantee is made or implied. SCOPE: cell and facility come only from the verified claims synqoria_cell / synqoria_facility; PostgreSQL
    forced row-level security repeats the check. This service holds no clinical data and no key material (key REFERENCES only). HEALTH: derived
    from fresh signals; a service with no fresh READINESS signal is UNKNOWN, never healthy; a HARD dependency that is DOWN or UNKNOWN caps the
    service at DEGRADED. TELEMETRY: events are redacted before storage (identifiers, secrets, long numbers, free text) and every read of telemetry
    is itself recorded. BACKUPS: a backup is RECORDED when created and VERIFIED only after five independent passing checks by a different person;
    the INTEGRITY check passes only if the digest recomputed from the artifact equals the recorded digest. RECOVERY: planned against a VERIFIED
    base backup and continuous WAL; independent authorization; positive fencing confirmation; restore must reach the target position; objects
    and external effects must be fully reconciled; audit chain recovered; six validations must pass; reopening is scoped to named services and
    approved by someone who neither planned nor authorized the recovery. RPO/RTO rows exist only for recoveries that actually reopened and are
    labelled EXERCISE or REAL. IDEMPOTENCY: every POST needs Idempotency-Key (replays return the stored response); transitions carry expectedVersion
    (mismatch is 409 stale_version).'
