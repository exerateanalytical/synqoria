          $ref: '#/components/responses/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationItem'
  /recoveries/{id}/reopening:
    post:
      operationId: recoveryReopen
      summary: Recovery reopen
      description: Requires `m40:reopen_approve`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-permission: m40:reopen_approve
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/Result'
        '201':
          $ref: '#/components/responses/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reopen'
  /recoveries/{id}/abort:
    post:
      operationId: recoveryAbort
      summary: Recovery abort
      description: Requires `m40:recovery_operate`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-permission: m40:recovery_operate
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/Result'
        '201':
          $ref: '#/components/responses/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Abort'
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.invalid/.well-known/openid-configuration
      description: Placeholder; issuer configured per hospital cell. Claims synqoria_cell, synqoria_facility, synqoria_permissions, synqoria_grant_expires.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Result:
      description: Resource, page or result object (see operation description)
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Unauthorized:
      description: identity_denied or grant_expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: permission_denied, grant_denied or an independence rule (*_must_be_independent)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Absent or outside the caller's cell/facility
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: stale_version, idempotency_collision, invalid_transition, backup_not_verified, wal_gap, restore_target_mismatch, objects_unreconciled,
        effects_unreconciled, fencing_not_confirmed, validation_incomplete, target_out_of_range, duplicate_record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Semantic validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      - details
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
    Dependency:
      type: object
      additionalProperties: false
      properties:
        serviceKey:
          type: string
        kind:
          type: string
    ServiceRequest:
      type: object
      additionalProperties: false
      properties:
        serviceKey:
          type: string
        name:
          type: string
        tier:
          type: string
        ownerRef:
          type: string
        recoveryBoundary:
          type: string
        sloTargetPct:
          type: number
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'
    SignalRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        value:
          type: number
        observedAt:
          type: string
          format: date-time
        traceId:
          type: string
    EventIn:
      type: object
      additionalProperties: false
      properties:
        correlationId:
          type: string
        traceId:
          type: string
        spanId:
          type: string
        serviceKey:
          type: string
        level:
          type: string
        eventType:
          type: string
        message:
          type: string
        attributes:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    EventBatch:
      type: object
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventIn'
    Declare:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        severity:
          type: string
        serviceKey:
          type: string
        impact:
          type: string
    Ack:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
      required:
      - expectedVersion
    Assign:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        ownerId:
          type: string
          format: uuid
      required:
      - expectedVersion
    Note:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        text:
          type: string
    Escalate:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        reason:
          type: string
      required:
      - expectedVersion
    StatusChange:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        to:
          type: string
        text:
          type: string
      required:
      - expectedVersion
    Resolve:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        verificationEvidence:
          type: string
      required:
      - expectedVersion
    BackupRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        snapshotId:
          type: string
        databaseRef:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        walStart:
          type: integer
        walEnd:
          type: integer
        objectRefs:
          type: array
          items:
            type: string
        sizeBytes:
          type: integer
        digest:
          type: string
        keyRef:
          type: string
        retentionUntil:
          type: string
          format: date-time
      required:
      - walStart
      - walEnd
      - sizeBytes
    Check:
      type: object
      additionalProperties: false
      properties:
        checkKey:
          type: string
        result:
          type: string
        evidenceRef:
          type: string
        observedDigest:
          type: string
    Verification:
      type: object
      additionalProperties: false
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
    Plan:
      type: object
      additionalProperties: false
      properties:
        scenario:
          type: string
        exercise:
          type: boolean
        baseBackupId:
          type: string
          format: uuid
        targetLsn:
          type: integer
        targetTime:
          type: string
          format: date-time
        outageStartedAt:
          type: string
          format: date-time
        incidentId:
          type: string
          format: uuid
      required:
      - exercise
      - targetLsn
    Authorize:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
      required:
      - expectedVersion
    StepRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        step:
          type: string
        evidenceRef:
          type: string
        egressDisabled:
          type: boolean
        writersStopped:
          type: boolean
        restoredLsn:
          type: integer
        objectsMissing:
          type: integer
        auditChainDigest:
          type: string
        effectsPending:
          type: integer
      required:
      - expectedVersion
    ValidationItem:
      type: object
      additionalProperties: false
      properties:
        itemKey:
          type: string
        result:
          type: string
        evidenceRef:
          type: string
        residualRisk:
          type: string
    Reopen:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        scope:
          type: array
          items:
            type: string
      required:
      - expectedVersion
    Abort:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        reason:
          type: string
      required:
      - expectedVersion
x-permissions:
  vocabulary:
  - m40:backup_read
  - m40:backup_record
  - m40:backup_verify
  - m40:health_read
  - m40:incident_manage
  - m40:incident_verify
  - m40:recovery_authorize
  - m40:recovery_operate
  - m40:recovery_plan
  - m40:recovery_read
  - m40:recovery_validate
  - m40:reopen_approve
  - m40:service_manage
  - m40:signal_report
  - m40:telemetry_ingest
  - m40:telemetry_read
  checker:
  - m40:backup_verify
  - m40:incident_verify
  - m40:recovery_authorize
  - m40:recovery_validate
  - m40:reopen_approve
