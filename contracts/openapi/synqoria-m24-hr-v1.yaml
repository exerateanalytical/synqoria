openapi: 3.1.0
info:
  title: SYNQORIA M24 Human Resources, Staffing and Payroll API
  version: 1.0.0
  description: 'Generated by tools/gen_m24_openapi.py from services/hr-payroll-core. Engineering contract; NOT legal or payroll-compliance sign-off.


    **Scope.** Cell and facility come only from the verified claims `synqoria_cell` / `synqoria_facility`; PostgreSQL forced row-level security
    repeats the check. Out-of-scope resources answer `404 not_found`. Records classified CONFIDENTIAL are invisible unless the token carries `m24:confidential_read`
    (enforced by a restrictive RLS policy). P03 remains the identity and grant authority: `user_ref` is an opaque reference and HR records cannot
    grant any privilege.


    **Money.** All amounts are decimal strings; no floating point is accepted or produced. Country/employer rules (rates, brackets, caps, rounding)
    are approved DATA versioned per country and employer; the service contains no statutory rates. Compensation is returned only to holders of
    `m24:comp_read` / `m24:payroll_read`; amounts never appear in audit or outbox events. Bank details are never stored: only an opaque vault
    token and a mask.


    **Controls.** Every maker-checker rule is enforced per record (the checker may not be the maker) and by database constraints. Approved runs
    lock their period; a run has a fixed batch hash that is recomputed at approval. A payment instruction is never a payment: `CONFIRMED` requires
    external provider evidence recorded by a person other than the instructor, with an exactly matching amount and a single-use provider reference.
    At most one live instruction exists per employee and period. Runs are `RECONCILED` only when every payable employee is independently confirmed.


    **Idempotency / concurrency.** Every POST needs `Idempotency-Key` (replays return the stored response); transitions carry `expectedVersion`
    (mismatch is `409 stale_version`).'
