      additionalProperties: false
      properties:
        staffNumber:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        departmentId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        hireDate:
          type: string
          format: date
        classification:
          type: string
        userRef:
          type: string
          format: uuid
    ChangeRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        kind:
          type: string
        effectiveDate:
          type: string
          format: date
        reason:
          type: string
        toDepartmentId:
          type: string
          format: uuid
        toPositionId:
          type: string
          format: uuid
      required:
