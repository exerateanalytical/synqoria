name: SYNQORIA M38 offline device client CI (engineering evidence, not hospital acceptance or certification)
on:
  push:
    branches:
      - work/claude-m38-device-client-integration-2026-11-07
    paths:
      - 'packages/offline-device-sdk/**'
      - 'apps/web/lib/offline/**'
      - 'apps/web/components/offline/**'
      - 'apps/web/app/api/offline/**'
      - 'tests/test_m38_device_sdk_contract.py'
      - 'tests/m38_offline_frontend.test.mjs'
      - 'tests/verified_oidc_session.test.mjs'
      - 'tests/operations_verified_session.test.mjs'
      - 'services/offline-sync-core/**'
      - '.github/workflows/m38-device-client-ci.yml'
  pull_request:
    paths:
      - 'packages/offline-device-sdk/**'
      - 'apps/web/lib/offline/**'
      - 'apps/web/components/offline/**'
      - 'apps/web/app/api/offline/**'
      - 'tests/test_m38_device_sdk_contract.py'
      - '.github/workflows/m38-device-client-ci.yml'
permissions:
  contents: read
jobs:
  sdk:
    name: Device SDK - TypeScript 5.8.3, tests, contract parity (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: TypeScript strict check of the SDK (pinned to the repository's TypeScript version, nothing added to the lockfile)
        run: npx --yes -p typescript@5.8.3 tsc -p packages/offline-device-sdk/tsconfig.json
      - name: SDK unit, fault-injection, isolation, authorization, privacy and real-reply interop tests
        run: node --test packages/offline-device-sdk/tests/
      - name: Contract parity with the canonical M38 OpenAPI (fails on drift)
        run: python tests/test_m38_device_sdk_contract.py
      - name: M38 screens - dictionaries, proxy allow-list, UX rules; session verifier fail-closed tests
        run: node --test tests/m38_offline_frontend.test.mjs tests/verified_oidc_session.test.mjs tests/operations_verified_session.test.mjs
  real-service-fixture:
    name: Real M38 service replies on PostgreSQL 18.6 (fixture drift guard)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/offline-sync-core/pom.xml
      - name: Start disposable PostgreSQL 18.6 on loopback
        run: |
          set -euo pipefail
          docker run -d --name m38d-pg -e POSTGRES_PASSWORD=m38d-ci-admin -e POSTGRES_DB=m38d_ci -p 127.0.0.1:5432:5432 postgres:18.6
          for i in $(seq 1 60); do
            docker exec m38d-pg psql -U postgres -d m38d_ci -Atc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            sleep 1
          done
      - name: Record real service replies and compare their shape with the committed SDK fixture
        working-directory: services/offline-sync-core
        env:
          SYNQORIA_OFFLINE_PG_TEST: '1'
          SYNQORIA_OFFLINE_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/m38d_ci
          SYNQORIA_OFFLINE_TEST_ADMIN_USER: postgres
          SYNQORIA_OFFLINE_TEST_ADMIN_PASSWORD: m38d-ci-admin
        run: mvn -B -ntp test -Dtest=SdkInteropFixtureTest
  live-rig:
    name: Live rig - SDK over HTTP to the real service, real OIDC issuer and PostgreSQL 18.6
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/offline-sync-core/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Start disposable PostgreSQL 18.6 and build the real service
        run: |
          set -euo pipefail
          docker run -d --name m38live-pg -e POSTGRES_PASSWORD=m38live-admin -e POSTGRES_DB=m38_live -p 127.0.0.1:5432:5432 postgres:18.6
          for i in $(seq 1 60); do
            docker exec m38live-pg psql -U postgres -d m38_live -Atc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            sleep 1
          done
          (cd services/offline-sync-core && mvn -B -ntp -q -DskipTests package)
      - name: Live end-to-end tests (synthetic data only)
        env:
          SYNQORIA_LIVE_RIG: '1'
          RIG_PG_CONTAINER: m38live-pg
          RIG_PG_DB: m38_live
          RIG_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/m38_live
          RIG_LOG: ${{ runner.temp }}/service.log
        run: node --test packages/offline-device-sdk/tests/live/
      - name: Service log tail on failure
        if: failure()
        run: tail -n 80 "${{ runner.temp }}/service.log" || true
  proxy-e2e:
    name: Proxy end-to-end - Next route handlers (cookie, CSRF, Origin, allow-list) to the real service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/offline-sync-core/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace packages (provides the repository's pinned Next) and build the real service
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          docker run -d --name m38e2e-pg -e POSTGRES_PASSWORD=m38e2e-admin -e POSTGRES_DB=m38_e2e -p 127.0.0.1:5432:5432 postgres:18.6
          for i in $(seq 1 60); do
            docker exec m38e2e-pg psql -U postgres -d m38_e2e -Atc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            sleep 1
          done
          (cd services/offline-sync-core && mvn -B -ntp -q -DskipTests package)
      - name: Proxy end-to-end tests (synthetic data only; local test issuer)
        env:
          SYNQORIA_LIVE_RIG: '1'
          RIG_PG_CONTAINER: m38e2e-pg
          RIG_PG_DB: m38_e2e
          RIG_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/m38_e2e
          RIG_LOG: ${{ runner.temp }}/service.log
          E2E_LOG: ${{ runner.temp }}/next.log
        run: node packages/offline-device-sdk/tests/e2e/launch.mjs
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 60 "${{ runner.temp }}/service.log" || true
          tail -n 60 "${{ runner.temp }}/next.log" || true
  web-build-informational:
    name: Web workspace TypeScript + Next build (informational - dependency ownership belongs to the integration lead)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build --workspace packages/ux-core
      - name: Strict web TypeScript check (includes the SDK imports)
        run: npm exec --workspace apps/web -- tsc --noEmit
      - name: Next build
        run: npm run build --workspace apps/web
