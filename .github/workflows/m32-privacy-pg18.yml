name: M32 consent privacy Java25/27 and PostgreSQL18.6 isolation tests
on:
  push:
    branches:
      - work/chatgpt-m32-consent-privacy-2026-11-07
  pull_request:
    paths:
      - 'services/privacy-core/**'
      - '.github/workflows/m32-privacy-pg18.yml'
permissions:
  contents: read
jobs:
  java-domain:
    strategy:
      matrix:
        java: ['25', '27']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: services/privacy-core/pom.xml
      - name: Compile and execute M32 domain and admission checks
        working-directory: services/privacy-core
        run: mvn -B -ntp test
  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/privacy-core/pom.xml
      - name: Start disposable PostgreSQL18.6
        run: |
          set -euo pipefail
          docker run -d --name m32-pg -e POSTGRES_PASSWORD=m32-admin-ci -e POSTGRES_DB=m32_ci -p 127.0.0.1:5432:5432 postgres:18.6
          for i in $(seq 1 60); do
            docker exec m32-pg psql -U postgres -d m32_ci -Atc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            sleep 1
          done
          docker exec m32-pg psql -U postgres -d m32_ci -Atc 'SHOW server_version'
      - name: Real JDBC migrations RLS revocation disclosure and privacy case tests
        working-directory: services/privacy-core
        env:
          SYNQORIA_PRIVACY_PG_TEST: '1'
          SYNQORIA_PRIVACY_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/m32_ci
          SYNQORIA_PRIVACY_TEST_ADMIN_USER: postgres
          SYNQORIA_PRIVACY_TEST_ADMIN_PASSWORD: m32-admin-ci
        run: mvn -B -ntp -Dtest=PrivacyPgIntegrationTest test
      - name: Explicit release denial
        if: always()
        run: echo "Synthetic consent/authority PostgreSQL tests only. Clinical/legal acceptance DENIED."
