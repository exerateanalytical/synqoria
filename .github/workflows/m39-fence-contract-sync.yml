name: SYNQORIA M39 generated route fence contract sync
on:
  pull_request:
    paths:
      - 'services/cell-lifecycle-core/src/main/java/org/synqoria/fleet/Api.java'
      - 'services/cell-lifecycle-core/src/main/java/org/synqoria/fleet/RoutingService.java'
      - 'tools/gen_m39_openapi.py'
      - 'contracts/openapi/synqoria-m39-fleet-v1.yaml'
      - '.github/workflows/m39-fence-contract-sync.yml'
permissions:
  contents: write
jobs:
  sync-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/chatgpt-m39-authoritative-routing-fence-2026-11-07'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Regenerate M39 contract from exact source
        run: python tools/gen_m39_openapi.py
      - name: Commit only generated contract when stale
        run: |
          set -euo pipefail
          git add contracts/openapi/synqoria-m39-fleet-v1.yaml
          if git diff --cached --quiet; then
            echo "OpenAPI contract already in sync"
            exit 0
          fi
          git config user.name "synqoria-contracts[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(m39): synchronize generated gateway fence OpenAPI"
          git push origin HEAD:${{ github.head_ref }}
