name: P03 B0053 least privilege PostgreSQL identities
on:
  push:
    branches:
      - work/p03-b0052-runtime-recovery-2026-11-06
  pull_request:
    paths:
      - apps/web/lib/identity-db-role-verification.mjs
      - apps/web/lib/staff-identity-runtime.mjs
      - tests/identity_db_role_postgres.test.mjs
      - .github/workflows/p03-b0053-postgres-roles.yml
permissions:
  contents: read
jobs:
  postgres-role-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-never-use-production
          POSTGRES_DB: synqoria_oidc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synqoria_oidc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check isolated identity DB role source invariants
        run: node --test tests/identity_db_role_verification.test.mjs
      - name: Validate real roles against PostgreSQL 16
        run: node --test tests/identity_db_role_postgres.test.mjs
        env:
          SYNQORIA_POSTGRES_INTEGRATION: "1"
      - name: Preserve full B0052 OIDC proof
        run: node --test tests/staff_identity_runtime.test.mjs
      - name: Scope
        run: echo "Disposable CI database; no production role provisioning or clinical release."
