name: SYNQORIA operations Java25 LTS and Java27 compatibility
on:
  push:
    branches:
      - work/latest-stable-stack-governance-2026-11-06
permissions:
  contents: read
jobs:
  compile-and-domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '27']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: services/operations-core/pom.xml
      - name: Compile Spring Boot 4 on current LTS or latest stable JDK and run source tests
        working-directory: services/operations-core
        run: mvn -B -ntp -DskipTests=false test
      - name: Show restricted release scope
        run: echo "Seven admin module workflow slices; no clinical release or completed user screens are claimed."
