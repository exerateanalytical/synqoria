name: SYNQORIA seven-module real JDBC atomicity integration
on:
  push:
    branches:
      - work/latest-stable-stack-governance-2026-11-06
permissions:
  contents: read
jobs:
  jdbc-pg16-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/operations-core/pom.xml
      - name: Start disposable PostgreSQL 18.6 on loopback
        run: |
          set -euo pipefail
          docker run -d --name synqoria-ops-jdbc-pg -e POSTGRES_PASSWORD=ops-ci-admin -e POSTGRES_DB=ops_ci -p 127.0.0.1:5432:5432 postgres:18.6
          for i in $(seq 1 45); do
            docker exec synqoria-ops-jdbc-pg psql -U postgres -d ops_ci -Atc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            sleep 1
          done
          docker exec synqoria-ops-jdbc-pg psql -U postgres -d ops_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE synqoria_operations_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEROLE NOCREATEDB NOREPLICATION NOBYPASSRLS PASSWORD 'ops-ci-only'"
          docker exec -i synqoria-ops-jdbc-pg psql -U postgres -d ops_ci -v ON_ERROR_STOP=1 < services/operations-core/db/migration/V001__seven_operations_cells.sql
      - name: Exercise Java repository actual JDBC optimistic versioning, idempotency, RLS, audit and outbox
        working-directory: services/operations-core
        env:
          SYNQORIA_OPS_PG_TEST: '1'
          SYNQORIA_OPS_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/ops_ci
          SYNQORIA_OPS_TEST_DB_USER: synqoria_operations_runtime
          SYNQORIA_OPS_TEST_DB_PASSWORD: ops-ci-only
        run: mvn -B -ntp -Dtest=OperationsStorePgIntegrationTest test
      - name: Explicitly deny deployment implication
        if: always()
        run: echo "Disposable PG18.6-JDBC synthetic verification; clinical release DENIED."
