name: SYNQORIA M39 fleet lifecycle CI (engineering evidence, not operational acceptance; no real cell is touched)
on:
  push:
    branches:
      - work/claude-m39-cell-lifecycle-2026-11-07
    paths:
      - 'services/cell-lifecycle-core/**'
      - 'contracts/openapi/synqoria-m39-fleet-v1.yaml'
      - 'apps/web/components/fleet/**'
      - 'apps/web/lib/fleet/**'
      - 'apps/web/app/workforce/fleet/**'
      - 'apps/web/app/api/fleet/**'
      - 'tests/m39_fleet_frontend.test.mjs'
      - 'tests/test_m39_openapi_contract.py'
      - 'tools/gen_m39_openapi.py'
      - '.github/workflows/m39-fleet-ci.yml'
  pull_request:
    paths:
      - 'services/cell-lifecycle-core/**'
      - 'contracts/openapi/synqoria-m39-fleet-v1.yaml'
      - 'apps/web/components/fleet/**'
      - 'apps/web/lib/fleet/**'
      - 'tests/m39_fleet_frontend.test.mjs'
      - 'tests/test_m39_openapi_contract.py'
      - 'tools/gen_m39_openapi.py'
      - 'docs/runbooks/M39_AUTHORITATIVE_GATEWAY_FENCE_2026-11-07.md'
      - '.github/workflows/m39-fleet-ci.yml'
permissions:
  contents: read
jobs:
  java-pg18:
    name: Java 25 + Spring Boot 4.1.2 + disposable PostgreSQL 18.6 (RLS, concurrency, governance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/cell-lifecycle-core/pom.xml
      - name: Start disposable PostgreSQL 18.6 on loopback
        run: |
          set -euo pipefail
          docker run -d --name m39-pg -e POSTGRES_PASSWORD=m39-ci-admin -e POSTGRES_DB=m39_ci -p 127.0.0.1:5432:5432 postgres:18.6
          for i in $(seq 1 60); do
            docker exec m39-pg psql -U postgres -d m39_ci -Atc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            sleep 1
          done
          docker exec m39-pg psql -U postgres -d m39_ci -Atc 'SHOW server_version'
      - name: Domain, admission and real PostgreSQL integration tests
        working-directory: services/cell-lifecycle-core
        env:
          SYNQORIA_FLEET_PG_TEST: '1'
          SYNQORIA_FLEET_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/m39_ci
          SYNQORIA_FLEET_TEST_ADMIN_USER: postgres
          SYNQORIA_FLEET_TEST_ADMIN_PASSWORD: m39-ci-admin
          SYNQORIA_FLEET_ROUTING_KEY: ci-only-routing-key-not-a-secret-0000000000000000
        run: mvn -B -ntp verify
      - name: Surefire summary
        if: always()
        run: grep -h "Tests run" services/cell-lifecycle-core/target/surefire-reports/*.txt || true
      - name: Explicitly deny clinical use
        if: always()
        run: echo "Synthetic fixtures only; no real hospital cell was provisioned, migrated or retired and no infrastructure credential was used."
  java-27-compat:
    name: Java 27 compatibility lane (informational, non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - name: Compile and run non-database tests on Java 27
        working-directory: services/cell-lifecycle-core
        run: mvn -B -ntp -Djava.version=27 test
  contract-and-web:
    name: OpenAPI parity + frontend logic/UX/i18n tests (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: OpenAPI contract parity with the Spring routes
        run: python tests/test_m39_openapi_contract.py
      - name: Frontend dictionaries, proxy allow-list, client, checksum and static UX rules
        run: node --test tests/m39_fleet_frontend.test.mjs
