name: M27 canonical 5-screen React/Next latest-stable build
on:
  push:
    branches:
      - work/chatgpt-m27-mortuary-2026-11-07
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/ux-core/**'
      - 'package-lock.json'
      - 'package.json'
      - 'tests/mortuary_screen_contract.test.mjs'
      - '.github/workflows/m27-web-build.yml'
permissions:
  contents: read
jobs:
  m27-react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Assert canonical source lock and version alignment
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const root=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const ux=JSON.parse(fs.readFileSync('packages/ux-core/package.json','utf8'));
          if(root.version!==lock.version||root.version!==ux.version)throw Error('workspace_version_drift');
          for(const folder of ['apps/web','apps/staff-mobile','apps/patient-mobile']){
           const pkg=JSON.parse(fs.readFileSync(folder+'/package.json','utf8'));
           if(pkg.version!==root.version||pkg.dependencies['@synqoria/ux-core']!==ux.version)
            throw Error('workspace_ux_version_drift:'+folder);
           if(lock.packages[folder]?.version!==undefined&&lock.packages[folder].version!==pkg.version)
            throw Error('workspace_lock_version_drift:'+folder);
           if(lock.packages[folder]?.dependencies?.['@synqoria/ux-core']!==ux.version)
            throw Error('lock_ux_dependency_drift:'+folder);
          }
          if(!root.workspaces.includes('packages/ux-core'))throw Error('ux_workspace_missing');
          NODE
      - name: Install exactly committed root npm workspaces
        run: npm ci --no-audit --no-fund
      - name: Verify all five M27 canonical screen contracts and safe backend routes
        run: node --test tests/mortuary_screen_contract.test.mjs tests/operations_screen_catalog.test.mjs
      - name: Build UX core and actual Next.js hospital workstations
        run: |
          npm run build --workspace @synqoria/ux-core
          npm run build --workspace @synqoria/web
      - name: Build evidence is not mortuary legal or clinical acceptance
        if: always()
        run: echo "No hospital identity or legal release signer has been connected; never claim production."
