name: M02 booking Java25/27 PostgreSQL18.6 integration
on:
  push:
    branches:
      - work/chatgpt-m02-appointments-2026-11-07
  pull_request:
    paths:
      - 'services/scheduling-core/**'
      - '.github/workflows/m02-scheduling-pg18.yml'
permissions:
  contents: read
jobs:
  java:
    strategy:
      matrix:
        java: ['25','27']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: services/scheduling-core/pom.xml
      - name: Compile scheduling service and check invariant tests
        working-directory: services/scheduling-core
        run: mvn -B -ntp test
  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/scheduling-core/pom.xml
      - name: Start disposable PostgreSQL18.6
        run: |
          set -euo pipefail
          docker run -d --name m02-pg -e POSTGRES_PASSWORD=m02-admin-ci -e POSTGRES_DB=m02_ci -p 127.0.0.1:5432:5432 postgres:18.6
          for i in $(seq 1 60); do
            docker exec m02-pg psql -U postgres -d m02_ci -Atc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            sleep 1
          done
          docker exec m02-pg psql -U postgres -d m02_ci -Atc 'SHOW server_version'
      - name: Verify real conflicting slots booking idempotency waitlist and RLS
        working-directory: services/scheduling-core
        env:
          SYNQORIA_M02_PG_TEST: '1'
          SYNQORIA_M02_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/m02_ci
          SYNQORIA_M02_TEST_ADMIN_USER: postgres
          SYNQORIA_M02_TEST_ADMIN_PASSWORD: m02-admin-ci
        run: mvn -B -ntp -Dtest=SchedulingPgIntegrationTest test
      - name: Release gate
        if: always()
        run: echo 'Synthetic patient proofs only. Hospital booking admission and patient ID integration not accepted.'
