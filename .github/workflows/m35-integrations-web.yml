name: M35 6-screen Next16 React19 verified build
on:
  push:
    branches: [work/chatgpt-m35-integration-management-2026-11-07]
  pull_request:
    paths:
      - 'apps/web/components/integrations/**'
      - 'apps/web/lib/integrations/**'
      - 'apps/web/app/workforce/integrations/**'
      - 'apps/web/app/api/integrations/**'
      - 'tests/m35_integrations_web.test.mjs'
      - '.github/workflows/m35-integrations-web.yml'
permissions:
  contents: read
jobs:
  m35-next:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Apply separately owned PR23 SHA-pinned lockfile in isolated runner
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/work/reproducible-npm-lock-candidate-2026-11-05:refs/remotes/origin/m35-pr23
          git show refs/remotes/origin/m35-pr23:package-lock.json > package-lock.json
          echo "6fa90a4aa72db790d86b7782d45ced40389b5f8987da65138fae7548b5f9eb2b  package-lock.json" | sha256sum -c -
      - name: Apply separately owned PR24 native compatibility without changing source
        run: |
          git fetch --no-tags origin refs/heads/work/real-next-expo-build-corrections-2026-11-05:refs/remotes/origin/m35-pr24
          for path in apps/staff-mobile/package.json apps/patient-mobile/package.json; do
            git show "refs/remotes/origin/m35-pr24:$path" > "$path"
          done
          node - <<'NODE'
          const fs=require('node:fs'),path='apps/web/package.json';
          const web=JSON.parse(fs.readFileSync(path,'utf8'));
          web.dependencies.next='16.4.5';
          web.dependencies.react='19.3.1';
          web.dependencies['react-dom']='19.3.1';
          web.devDependencies['@types/react']='19.3.0';
          fs.writeFileSync(path,JSON.stringify(web,null,2)+'\n');
          NODE
      - name: Recompute and install supported workspace dependencies in CI only
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Contract-test real M35 routes and authenticated API proxy
        run: node --test tests/m35_integrations_web.test.mjs
      - name: Build UX and 6 canonical workstations
        run: |
          npm run build --workspace @synqoria/ux-core
          npm run build --workspace @synqoria/web
      - name: Explicit acceptance boundary
        if: always()
        run: echo "M35 source build only. Institutional clinical/production acceptance denied."
