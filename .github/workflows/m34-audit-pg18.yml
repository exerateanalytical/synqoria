name: M34 audit Java25/27 and PostgreSQL18.6 evidence integrity
on:
  push:
    branches:
      - work/chatgpt-m34-audit-provenance-2026-11-07
  pull_request:
    paths:
      - 'services/audit-core/**'
      - '.github/workflows/m34-audit-pg18.yml'
permissions:
  contents: read
jobs:
  java-domain:
    strategy:
      matrix:
        java: ['25','27']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: services/audit-core/pom.xml
      - name: Java compile, domain rules and source unit tests
        working-directory: services/audit-core
        run: mvn -B -ntp test
  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/audit-core/pom.xml
      - name: Start disposable PostgreSQL18.6
        run: |
          set -euo pipefail
          docker run -d --name m34-pg -e POSTGRES_PASSWORD=m34-admin-ci -e POSTGRES_DB=m34_ci -p 127.0.0.1:5432:5432 postgres:18.6
          for i in $(seq 1 60); do
            docker exec m34-pg psql -U postgres -d m34_ci -Atc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            sleep 1
          done
          docker exec m34-pg psql -U postgres -d m34_ci -Atc 'SHOW server_version'
      - name: Real RLS issuer proof revocation chain export and retention integration
        working-directory: services/audit-core
        env:
          SYNQORIA_AUDIT_PG_TEST: '1'
          SYNQORIA_AUDIT_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/m34_ci
          SYNQORIA_AUDIT_TEST_ADMIN_USER: postgres
          SYNQORIA_AUDIT_TEST_ADMIN_PASSWORD: m34-admin-ci
        run: mvn -B -ntp -Dtest=AuditPgIntegrationTest test
      - name: Prohibit clinical certification inference
        if: always()
        run: echo "Synthetic envelopes and PostgreSQL tests only. No certified audit archive or hospital clinical acceptance."
