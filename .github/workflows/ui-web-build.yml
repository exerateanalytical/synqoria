name: SYNQORIA UI Next web build verification
on:
  push:
    branches:
      - work/ui-controls-coverage-2026-11-05
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web workspace packages without running lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build internal UX-core workspace typings
        run: npm run build --workspace packages/ux-core
      - name: Strict web TypeScript check
        run: npm exec --workspace apps/web -- tsc --noEmit
      - name: Build Next web routes
        run: npm run build --workspace apps/web
      - name: Limitations
        run: echo "Build success is not browser visual testing, accessibility assessment, API integration or clinical certification"
