name: SYNQORIA M21 M22 M25 M29 M37 coordinated integrations (engineering, not hospital acceptance)
on:
  pull_request:
    paths:
      - 'services/operations-core/**'
      - '.github/workflows/five-operational-integrations-ci.yml'
  push:
    paths:
      - 'services/operations-core/**'
      - '.github/workflows/five-operational-integrations-ci.yml'
permissions:
  contents: read
jobs:
  java25-pg18:
    name: Java25 / PostgreSQL18.6 / five modules / FORCE RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/operations-core/pom.xml
      - name: Start disposable PostgreSQL18.6 and restricted role; install authoritative migrations
        run: |
          set -euo pipefail
          docker run -d --name synqoria-ops-five -e POSTGRES_PASSWORD=ops-ci-admin -e POSTGRES_DB=ops_ci -p 127.0.0.1:5432:5432 postgres:18.6
          for i in $(seq 1 60); do
            docker exec synqoria-ops-five psql -U postgres -d ops_ci -Atc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            sleep 1
          done
          docker exec synqoria-ops-five psql -U postgres -d ops_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE synqoria_operations_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEROLE NOCREATEDB NOREPLICATION NOBYPASSRLS PASSWORD 'ops-ci-only'"
          for migration in services/operations-core/db/migration/V{001,002,003,004}__*.sql services/operations-core/db/migration/V011__m22_scoped_stock_count_review.sql; do
            echo "Applying $migration"
            docker exec -i synqoria-ops-five psql -U postgres -d ops_ci -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Full operations unit and five-module PostgreSQL integration tests
        working-directory: services/operations-core
        env:
          SYNQORIA_OPS_PG_TEST: '1'
          SYNQORIA_OPS_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/ops_ci
          SYNQORIA_OPS_TEST_DB_USER: synqoria_operations_runtime
          SYNQORIA_OPS_TEST_DB_PASSWORD: ops-ci-only
          SYNQORIA_OPS_TEST_ADMIN_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/ops_ci
          SYNQORIA_OPS_TEST_ADMIN_USER: postgres
          SYNQORIA_OPS_TEST_ADMIN_PASSWORD: ops-ci-admin
        run: mvn -B -ntp verify
      - name: Print exact test evidence
        if: always()
        run: grep -h 'Tests run' services/operations-core/target/surefire-reports/*.txt || true
      - name: Evidence boundary
        if: always()
        run: echo 'Synthetic fixtures and disposable PostgreSQL; no real delivery provider, ambulance GPS or bank/ERP API and no hospital release.'
  java27-compat:
    name: Java27 compatibility (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - name: Compile and unit verification
        working-directory: services/operations-core
        run: mvn -B -ntp test
