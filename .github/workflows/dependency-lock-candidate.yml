# Isolated draft-PR dependency candidate; never merge automatically or authorize clinical release.
name: Propose npm lockfile (manual review required)
on:
  workflow_dispatch:
  push:
    branches:
      - work/reproducible-npm-lock-candidate-2026-11-05
    paths:
      - .github/workflows/dependency-lock-candidate.yml
permissions:
  contents: write
jobs:
  propose-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate pinned source manifests before network resolution
        run: python3 tools/dependency_compatibility.py
      - name: Generate candidate lockfile from trusted npm registry
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --fetch-retries=2
      - name: Verify lockfile integrity, workspace mapping and origin
        run: |
          python3 tools/dependency_release_gate.py
          python3 tools/verify_lock_integrity.py
      - name: Verify clean install from the resolved lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve lockfile for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synqoria-lockfile-candidate-review-required
          path: package-lock.json
          if-no-files-found: warn
      - name: Publish verified candidate ONLY to review branch
        run: |
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Candidate unchanged"
          else
            git commit -m "build(deps): publish verified lockfile candidate (review required)"
            git push origin HEAD:work/reproducible-npm-lock-candidate-2026-11-05
          fi
          echo "No automatic merge, deployment or clinical qualification"
