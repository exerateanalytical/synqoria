name: SYNQORIA 35 operations screen contract previews
on:
  push:
    branches:
      - work/seven-operations-real-workflows-2026-11-06
permissions:
  contents: read
jobs:
  canonical-screen-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Match 35 screen contracts against canonical source and keep write actions denied
        run: node --test tests/operations_screen_catalog.test.mjs tests/operations_delivery_ledger.test.mjs
      - name: No clinical acceptance claim
        run: echo "The 35 screens are LOCKED PREVIEWS, not user-accepted production workstations."
