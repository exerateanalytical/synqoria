name: SYNQORIA seven operations real PostgreSQL16 RLS migration
on:
  push:
    branches:
      - work/operations-seven-module-service-2026-11-06
permissions:
  contents: read
jobs:
  disposable-pg16-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable isolated PG16 (not hospital production)
        run: |
          set -euo pipefail
          docker run -d --name synqoria-ops-pg -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=ops_ci postgres:16
          for i in $(seq 1 45); do
            docker exec synqoria-ops-pg psql -U postgres -d ops_ci -Atc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            sleep 1
          done
          docker exec synqoria-ops-pg psql -U postgres -d ops_ci -Atc 'SHOW server_version_num' | grep -E '^16'
      - name: Provision restricted non-owner runtime in disposable database
        run: |
          docker exec synqoria-ops-pg psql -U postgres -d ops_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE synqoria_operations_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEROLE NOCREATEDB NOREPLICATION NOBYPASSRLS'
      - name: Apply complete seven-module PostgreSQL schema as migration owner
        run: |
          set -euo pipefail
          docker exec -i synqoria-ops-pg psql -U postgres -d ops_ci -v ON_ERROR_STOP=1 < services/operations-core/db/migration/V001__seven_operations_cells.sql
      - name: Confirm six FORCE RLS tables, no public access and missing-scope default deny
        run: |
          set -euo pipefail
          n=$(docker exec synqoria-ops-pg psql -U postgres -d ops_ci -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='synqoria_operations' AND c.relkind='r' AND c.relrowsecurity AND c.relforcerowsecurity")
          test "$n" = 6
          docker exec synqoria-ops-pg psql -U postgres -d ops_ci -v ON_ERROR_STOP=1 -c "
            SET ROLE synqoria_operations_runtime;
            SELECT count(*) FROM synqoria_operations.items;" | grep -q 0
          if docker exec synqoria-ops-pg psql -U postgres -d ops_ci -v ON_ERROR_STOP=1 -c "
            SET ROLE synqoria_operations_runtime;
            INSERT INTO synqoria_operations.items
             (id,cell_id,facility_id,module_id,record_type,status,version,created_by,last_actor,fields)
             VALUES ('11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             '33333333-3333-4333-8333-333333333333','M21','REQUISITION','DRAFT',1,
             '44444444-4444-4444-8444-444444444444',
             '44444444-4444-4444-8444-444444444444','{}'::jsonb)"; then
            echo 'RLS unscoped INSERT unexpectedly accepted' >&2
            exit 1
          fi
      - name: Scoped insert, cross-facility isolation and append-only audit privileges
        run: |
          set -euo pipefail
          docker exec synqoria-ops-pg psql -U postgres -d ops_ci -v ON_ERROR_STOP=1 -c "
            BEGIN;
            SET LOCAL ROLE synqoria_operations_runtime;
            SELECT set_config('synqoria.cell','22222222-2222-4222-8222-222222222222',true);
            SELECT set_config('synqoria.facility','33333333-3333-4333-8333-333333333333',true);
            INSERT INTO synqoria_operations.items
             (id,cell_id,facility_id,module_id,record_type,status,version,created_by,last_actor,fields)
             VALUES ('11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             '33333333-3333-4333-8333-333333333333','M21','REQUISITION','DRAFT',1,
             '44444444-4444-4444-8444-444444444444',
             '44444444-4444-4444-8444-444444444444','{"title":"Safe"}'::jsonb);
            COMMIT;"
          scoped=$(docker exec synqoria-ops-pg psql -U postgres -d ops_ci -Atc "
            BEGIN; SET LOCAL ROLE synqoria_operations_runtime;
            SELECT set_config('synqoria.cell','22222222-2222-4222-8222-222222222222',true);
            SELECT set_config('synqoria.facility','33333333-3333-4333-8333-333333333333',true);
            SELECT count(*) FROM synqoria_operations.items;
            COMMIT;" | grep '^1$' | wc -l)
          test "$scoped" = 1
          cross=$(docker exec synqoria-ops-pg psql -U postgres -d ops_ci -Atc "
            BEGIN; SET LOCAL ROLE synqoria_operations_runtime;
            SELECT set_config('synqoria.cell','22222222-2222-4222-8222-222222222222',true);
            SELECT set_config('synqoria.facility','55555555-5555-4555-8555-555555555555',true);
            SELECT count(*) FROM synqoria_operations.items;
            COMMIT;" | grep '^0$' | wc -l)
          test "$cross" = 1
          if docker exec synqoria-ops-pg psql -U postgres -d ops_ci -v ON_ERROR_STOP=1 -c "
            BEGIN;
            SET LOCAL ROLE synqoria_operations_runtime;
            SELECT set_config('synqoria.cell','22222222-2222-4222-8222-222222222222',true);
            SELECT set_config('synqoria.facility','33333333-3333-4333-8333-333333333333',true);
            UPDATE synqoria_operations.audit_events SET action='FORGED';
            COMMIT;"; then
            echo 'Audit mutation unexpectedly allowed' >&2
            exit 1
          fi
      - name: Never imply deployed hospital system or operational acceptance
        if: always()
        run: echo "PG16 synthetic CI only; clinical release DENIED, seven modules not clinically accepted."
